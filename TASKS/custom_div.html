<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <lable>Enter the Text::</lable>
    <input type="text" id="text"><br>
    <lable>Enter the TextColor::</lable>
    <input type="text" id="TextColor"><br>
    <lable>Enter the background color::</lable>
    <input type="text" id="background"><br>
    <lable>Enter the Height::</lable>
    <input type="text" id="Height"><br>
    <lable>Enter the Width::</lable>
    <input type="text" id="Width">
    <br>
    <br>
    <button id="div" onclick="div()">Submit</button>
    <br>
    <br>
   <div id="output"></div>
   <script>
        function div()
        {
            var t=text.value
            var tc=TextColor.value
            var b=background.value
            var h=Height.value
            var w=Width.value
          
            output.innerHTML=t
            output.style.backgroundColor=b
            output.style.color=tc
            output.style.height=h
            output.style.width=w
        }
   </script>
</body>
</html>
