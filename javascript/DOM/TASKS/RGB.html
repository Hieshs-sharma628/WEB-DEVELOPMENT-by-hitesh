<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label>Enter red color quantity ::</label><br>
    <input type="text" id="r">
    <br>
    <label>Enter green color quantity ::</label><br>
    <input type="text" id="g">
    <br>
    <label>Enter blue color quantity ::</label><br>
    <input type="text" id="b">
    <br>
    <br>
    <button onclick="displaycolor()">See color</button>
    <br><br>
 <div id="output" style="height: 50px;width: 50px;"></div>
<script>
    function displaycolor(){
        var red=r.value
        var green=g.value
        var blue=b.value
        output.style.backgroundColor = `rgb(${red}, ${green}, ${blue})`;
    }
</script>
</body>

</html>
