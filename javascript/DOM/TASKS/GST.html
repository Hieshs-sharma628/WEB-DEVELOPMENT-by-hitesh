<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>
    <h1>Gst calculator</h1>
    <label>Enter amount::</label>
    <input type="text" id="amount" placeholder="eg::XX,00000....">
    <br>
    <button onclick="gstcalculator()">Claculate</button><br>
    <h1 id="gstamount"></h1>
    <h1 id="output"></h1>
    <script>
        function gstcalculator(){
            var num=Number(amount.value)
            gst_amount=num*18/100
            gstamount.innerHTML="GST Amount ::"+ gst_amount
            output.innerHTML="Total Price ::"+ Number(gst_amount+num)
        }
    </script>
</body>
</html>
