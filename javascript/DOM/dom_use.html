<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            height: 600px;
            border:5px solid;
        }
        #row1{
            display: flex;
            flex-direction:row;
            justify-content: center;
            margin-bottom: 40px;
            margin-top: 30px;
        }
        #row2{
            display:flex;
            flex-direction: row;
            justify-content: space-evenly;
        }
        img{
            height:250px;
            width: 250px;
        };
    </style>
</head>
<body>
    <div id="container">
        <div id="row1">
            <img id="change" src="main.jpg"><br>
        </div>
        <div id="row2">
            <img src="img1.jpg" onmouseover="hit('img1.jpg')" onmouseout="hit('main.jpg')">
            <img src="img2.jpg" onmouseover="hit('img2.jpg')" onmouseout="hit('main.jpg')">
            <img src="img3.jpg" onmouseover="hit('img3.jpg')" onmouseout="hit('main.jpg')">
        </div>
    </div>
    <script>
        function hit(x){
            change.src=x
        }
    </script>
</body>
</html>
