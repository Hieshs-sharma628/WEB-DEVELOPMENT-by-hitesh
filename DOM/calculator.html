    <br>
    <button id="sum" onclick="claculate()">+</button>
    <button id="sum" onclick="claculate()">-</button>
    <button id="sum" onclick="claculate()">*</button>
    <button id="sum" onclick="claculate()">/</button>
    <h1 id="output"></h1>

        function claculate(){
            var a=Number(value1.value)
            var b=Number(value2.value)
            output.innerHTML=a+b
            output.innerHTML=a-b
            output.innerHTML=a*b
            output.innerHTML=a/b
        }
